<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0f172a">
  <meta name="description" content="Offline generic medicine price finder for Indian patients. Compare Jan Aushadhi generic alternatives and see your savings.">
  <title>Generic Dawa | जेनेरिक दवा</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="icons/icon-192.svg">
  <link rel="apple-touch-icon" href="icons/icon-192.svg">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/print.css" media="print">
</head>
<body>

  <!-- Test Data Warning Banner (Rule 2) -->
  <aside id="placeholder-banner" class="placeholder-banner hidden" role="alert" data-i18n="placeholderBanner">
    ⚠️ DEMO / PLACEHOLDER DATA LOADED (data/drugs.sample.csv). Prices and items are for testing only.
  </aside>

  <main class="app-container">
    <!-- Header -->
    <header class="app-header">
      <h1 class="brand-title">
        <span data-i18n="appTitle">Generic Dawa</span>
        <span class="badge" data-i18n="appBadge">जन औषधि</span>
      </h1>
      <button id="lang-toggle-btn" class="lang-toggle" aria-label="Toggle Language">
        हिन्दी
      </button>
    </header>

    <!-- Search Box -->
    <section class="search-section" aria-label="Medicine Search">
      <div class="search-box-wrapper">
        <input 
          type="search" 
          id="search-input" 
          class="search-input" 
          placeholder="Type brand name (e.g. Augmentin)..." 
          autocomplete="off" 
          autocorrect="off" 
          spellcheck="false"
          enterkeyhint="search"
          aria-label="Search Medicine"
        >
        <button id="clear-search-btn" class="clear-btn hidden" aria-label="Clear search">✕</button>
      </div>
    </section>

    <!-- Results Area -->
    <section id="results-area" class="results-section" aria-live="polite">
      <div id="status-card" class="status-card" data-i18n="initialStatus">
        Type medicine brand name or molecule to check generic price and savings.
      </div>
      <div id="result-container"></div>
    </section>

    <!-- Multi-Drug Prescription List Dock (Step 13) -->
    <aside id="cart-dock" class="cart-dock hidden" role="region" aria-label="Prescription List Summary">
      <div class="cart-dock-info">
        <span id="cart-count-badge" class="cart-badge">0</span>
        <div class="cart-dock-text">
          <strong id="cart-dock-savings">Save ₹0</strong>
          <span id="cart-dock-sub">View list & savings</span>
        </div>
      </div>
      <button id="view-cart-btn" class="cart-dock-btn" aria-label="View Medicine List">
        📋 <span data-i18n="myListTitle">My Medicine List</span>
      </button>
    </aside>

    <!-- Cart / Prescription List Modal Drawer -->
    <div id="cart-modal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="cart-modal-title">
      <div class="modal-content">
        <div class="modal-header">
          <h2 id="cart-modal-title" data-i18n="myListTitle">My Medicine List</h2>
          <button id="close-cart-btn" class="close-modal-btn" aria-label="Close">✕</button>
        </div>

        <div id="cart-summary-card" class="savings-banner">
          <div class="savings-headline">
            <span id="cart-total-brand" class="savings-old-price">₹0</span>
            <span class="savings-arrow">→</span>
            <span id="cart-total-generic" class="savings-new-price">₹0</span>
          </div>
          <div id="cart-total-badge" class="savings-badge-pill">
            ⚡ TOTAL SAVINGS: ₹0 (0%)
          </div>
        </div>

        <div id="cart-items-container" class="cart-items-list">
          <!-- Populated by JavaScript -->
        </div>

        <div class="cart-modal-actions">
          <button id="print-slip-btn" class="action-btn print-btn">
            🖨️ <span data-i18n="printSlipBtn">Print Prescription Slip</span>
          </button>
          <button id="clear-cart-btn" class="action-btn clear-list-btn" data-i18n="clearListBtn">
            Clear List
          </button>
        </div>
      </div>
    </div>

    <!-- Hidden on screen, visible only when printing across pharmacy counter -->
    <section id="printable-slip" class="printable-slip-area" aria-hidden="true"></section>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
