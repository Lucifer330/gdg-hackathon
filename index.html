<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0f172a">
  <meta name="description" content="Offline generic medicine price finder for Indian patients. Compare Jan Aushadhi generic alternatives and see your savings.">
  <title>Generic Dawa | जेनेरिक दवा</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="icons/icon-192.svg">
  <link rel="apple-touch-icon" href="icons/icon-192.svg">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Test Data Warning Banner (Rule 2) -->
  <aside id="placeholder-banner" class="placeholder-banner hidden" role="alert" data-i18n="placeholderBanner">
    ⚠️ DEMO / PLACEHOLDER DATA LOADED (data/drugs.sample.csv). Prices and items are for testing only.
  </aside>

  <main class="app-container">
    <!-- Header -->
    <header class="app-header">
      <h1 class="brand-title">
        <span data-i18n="appTitle">Generic Dawa</span>
        <span class="badge" data-i18n="appBadge">जन औषधि</span>
      </h1>
      <button id="lang-toggle-btn" class="lang-toggle" aria-label="Toggle Language">
        हिन्दी
      </button>
    </header>

    <!-- Search Box -->
    <section class="search-section" aria-label="Medicine Search">
      <div class="search-box-wrapper">
        <input 
          type="search" 
          id="search-input" 
          class="search-input" 
          placeholder="Type brand name (e.g. Augmentin)..." 
          autocomplete="off" 
          autocorrect="off" 
          spellcheck="false"
          enterkeyhint="search"
          aria-label="Search Medicine"
        >
        <button id="clear-search-btn" class="clear-btn hidden" aria-label="Clear search">✕</button>
      </div>
    </section>

    <!-- Results Area -->
    <section id="results-area" class="results-section" aria-live="polite">
      <div id="status-card" class="status-card" data-i18n="initialStatus">
        Type medicine brand name or molecule to check generic price and savings.
      </div>
      <div id="result-container"></div>
    </section>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
