<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="pillGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#16a34a" />
    </linearGradient>
    <linearGradient id="pillWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="100" fill="url(#bg)" stroke="#38bdf8" stroke-width="8" />
  
  <!-- Pill Container rotated 45 deg -->
  <g transform="translate(256, 256) rotate(-45) translate(-256, -256)">
    <!-- Pill Left / Green Half -->
    <path d="M176,176 A80,80 0 0,1 336,176 L336,256 L176,256 Z" fill="url(#pillGreen)" />
    <!-- Pill Right / White Half -->
    <path d="M176,256 L336,256 L336,336 A80,80 0 0,1 176,336 Z" fill="url(#pillWhite)" />
    <!-- Center divider band -->
    <line x1="176" y1="256" x2="336" y2="256" stroke="#0f172a" stroke-width="6" />
  </g>

  <!-- Large Rupee Symbol in Center -->
  <text x="256" y="320" font-family="system-ui, -apple-system, sans-serif" font-size="190" font-weight="900" fill="#0f172a" text-anchor="middle">₹</text>
  
  <!-- Subtext banner -->
  <text x="256" y="460" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" fill="#38bdf8" text-anchor="middle" letter-spacing="2">GENERIC DAWA</text>
</svg>
